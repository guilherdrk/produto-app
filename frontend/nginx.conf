server {
    listen 80;
    server_name localhost;

    # Raiz onde ficam os arquivos compilados do Angular
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para melhor performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # IMPORTANTE: Angular usa client-side routing (SPA)
    # Sem isso, ao recarregar /produtos o Nginx retorna 404
    # "try_files" tenta o arquivo, depois a pasta, depois retorna index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso: /api/* é redirecionado para o backend
    # O Angular em prod não conhece "localhost:8080" — o Nginx faz a ponte
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de assets estáticos (JS, CSS, imagens)
    location ~* \.(js|css|png|jpg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Não logar requisições de health check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
