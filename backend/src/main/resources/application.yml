spring:
  application:
    name: produto-app

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:produto_db}
    username: ${POSTGRES_USER:produto_user}
    password: ${POSTGRES_PASSWORD:produto_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # ? importante! N�o deixe o Hibernate criar tabelas
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:minha-chave-secreta-super-segura-com-256-bits-minimo-aqui}
  expiration: 86400000  # 24 horas em milissegundos