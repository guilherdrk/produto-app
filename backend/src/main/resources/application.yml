spring:
  application:
    name: produto-app

  datasource:
    # SPRING_DATASOURCE_URL sobrescreve esta config quando definida como variável de ambiente
    # No Docker: postgres:5432 (nome do serviço)
    # Localmente: localhost:5432
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:produto_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:produto_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:produto_pass}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false           # false em produção — não loga cada query
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:chave-local-de-desenvolvimento-apenas}
  expiration: 86400000        # 24 horas em milissegundos

# Actuator: expõe /actuator/health publicamente para health checks do Docker
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never     # Não expõe detalhes internos publicamente