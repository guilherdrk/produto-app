# ============================================================
# CD — Entrega Contínua (Continuous Delivery)
#
# QUANDO EXECUTA:
#   - Push na branch 'main' (após merge de PR aprovado)
#   - Execução manual via GitHub Actions UI
#
# OBJETIVO:
#   Construir as imagens Docker e publicar no Docker Hub.
#   As imagens ficam prontas para serem implantadas em qualquer servidor.
#
# PRÉ-REQUISITOS (configurar em Settings → Secrets):
#   DOCKER_USERNAME  → seu usuário do Docker Hub
#   DOCKER_PASSWORD  → sua senha ou Access Token do Docker Hub
# ============================================================

name: CD — Build e Publicação de Imagens Docker

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pela UI do GitHub

# Só uma execução de CD por vez
concurrency:
  group: cd-main
  cancel-in-progress: false  # CD nunca cancela — deixa terminar

jobs:

  # ============================================================
  # JOB: Build e Push das imagens Docker
  # ============================================================
  docker:
    name: 🐳 Build e Push Docker Hub
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o repositório
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Docker Buildx
      # Buildx é o builder moderno do Docker — suporta multi-platform
      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login no Docker Hub usando os Secrets configurados no GitHub
      # NUNCA coloque credenciais diretamente no código!
      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Gera as tags automaticamente
      # Ex: latest, 1.0.0, sha-abc1234
      - name: 🏷️ Gerar metadados do backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/produto-app-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: 🏷️ Gerar metadados do frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/produto-app-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # 5. Build e Push do Backend
      # cache-from/cache-to: reutiliza camadas de builds anteriores
      - name: 🔧 Build e Push — Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha    # GitHub Actions Cache
          cache-to: type=gha,mode=max

      # 6. Build e Push do Frontend
      - name: 🎨 Build e Push — Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Resumo da execução — aparece na aba Summary do Actions
      - name: 📋 Resumo
        run: |
          echo "## 🐳 Imagens publicadas com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-backend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-frontend.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
